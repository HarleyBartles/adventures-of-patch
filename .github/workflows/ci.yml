name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The marketplace source is public, so the runner can initialize the
          # submodule and run the same preflight the pre-commit hook uses.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Run preflight checks
        shell: pwsh
        run: python tools/run.py ci --check

  repo-hygiene:
    name: Repo hygiene
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No generated surfaces or submodules are needed for whitespace checks.
          submodules: false

      - name: Check for whitespace and diff issues
        shell: pwsh
        run: git diff --check "HEAD^..HEAD" -- . ':(exclude).agents/skills'
