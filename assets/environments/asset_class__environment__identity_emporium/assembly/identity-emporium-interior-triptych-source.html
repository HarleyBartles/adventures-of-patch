<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Identity Emporium — Interior Locations</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f3ead7; }
  body {
    width: 1600px;
    height: 1050px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #143824;
  }
  .sheet {
    width: 1600px;
    height: 1050px;
    padding: 34px 42px 26px 42px;
    background: #f3ead7;
    border: 7px solid #153826;
    box-shadow: inset 0 0 0 4px #d4a24d, inset 0 0 0 8px #f8f0df, inset 0 0 0 11px #153826;
    overflow: hidden;
  }
  .title {
    text-align: center;
    font-size: 52px;
    letter-spacing: 8px;
    font-weight: 700;
    margin: 8px 0 8px 0;
    color: #143824;
  }
  .rule {
    width: 72%;
    height: 2px;
    background: #a9792d;
    margin: 0 auto 28px auto;
    box-shadow: 0 9px 0 #c89c5a;
  }
  .panels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    height: 735px;
  }
  .panel { display: flex; flex-direction: column; align-items: center; }
  .frame {
    width: 100%;
    height: 640px;
    padding: 7px;
    border: 4px solid #143824;
    background: #d6a048;
    box-shadow: inset 0 0 0 3px #f8f0df, inset 0 0 0 6px #143824;
    overflow: hidden;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .caption {
    margin-top: 26px;
    text-align: center;
    font-size: 31px;
    letter-spacing: 2px;
    font-weight: 700;
    color: #143824;
  }
  .caption-rule {
    width: 170px;
    height: 2px;
    background: #b38337;
    margin: 8px auto 0 auto;
  }
  .footer {
    margin-top: 54px;
    text-align: center;
    font-size: 18px;
    color: #685f52;
    letter-spacing: .7px;
  }
</style>
</head>
<body>
  <main class="sheet">
    <div class="title">IDENTITY EMPORIUM — INTERIOR LOCATIONS</div>
    <div class="rule"></div>
    <section class="panels">
      <div class="panel">
        <div class="frame"><img src="https://raw.githubusercontent.com/HarleyBartles/adventures-of-patch/main/assets/environments/asset_class__environment__identity_emporium/assembly/b23687cf-a468-4aa9-a0ef-2ea9515857f0.png" alt="Main sales floor"></div>
        <div class="caption">MAIN SALES FLOOR</div>
        <div class="caption-rule"></div>
      </div>
      <div class="panel">
        <div class="frame"><img src="https://raw.githubusercontent.com/HarleyBartles/adventures-of-patch/main/assets/environments/asset_class__environment__identity_emporium/assembly/949e3156-c763-4f9e-9178-c01f43d658d4.png" alt="Costume and prop wall"></div>
        <div class="caption">COSTUME &amp; PROP WALL</div>
        <div class="caption-rule"></div>
      </div>
      <div class="panel">
        <div class="frame"><img src="https://raw.githubusercontent.com/HarleyBartles/adventures-of-patch/main/assets/environments/asset_class__environment__identity_emporium/assembly/1786b8b9-8360-44e3-9bf0-a0e5373a8821.png" alt="Counter and checkout"></div>
        <div class="caption">COUNTER / CHECKOUT</div>
        <div class="caption-rule"></div>
      </div>
    </section>
    <div class="footer">Stage 2b interior environment asset sheet • no characters • source views only</div>
  </main>
</body>
</html>
